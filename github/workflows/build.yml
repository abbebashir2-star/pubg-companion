          cat > "$PKG/data/GameModeState.kt" <<'EOF'
          package ai.venice.pubgcompanion.data

          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import ai.venice.pubgcompanion.core.PerfMode
          import java.time.LocalTime

          data class LiveStats(
              val fps: Int = 0,
              val fpsIsReal: Boolean = false,
              val batteryTempC: Float = 0f,
              val throttling: Boolean = false,
              val pingMs: Int = -1,
              val jitterMs: Float = 0f,
              val lossPercent: Float = 0f,
          )

          object GameModeState {

              private val _inGame = MutableStateFlow(false)
              val inGame: StateFlow<Boolean> = _inGame

              private val _activeProfile = MutableStateFlow<String?>(null)
              val activeProfile: StateFlow<String?> = _activeProfile

              private val _mode = MutableStateFlow<PerfMode?>(null)
              val mode: StateFlow<PerfMode?> = _mode

              private val _stats = MutableStateFlow(LiveStats())
              val stats: StateFlow<LiveStats> = _stats

              private val _log = MutableStateFlow<List<String>>(emptyList())
              val log: StateFlow<List<String>> = _log

              fun setInGame(v: Boolean) { _inGame.value = v }
              fun setProfile(v: String?) { _activeProfile.value = v }
              fun setMode(m: PerfMode?) { _mode.value = m }
              fun updateStats(block: (LiveStats) -> LiveStats) { _stats.value = block(_stats.value) }

              fun note(msg: String) {
                  val stamp = LocalTime.now().withNano(0).toString()
                  _log.value = (_log.value + "$stamp  $msg").takeLast(60)
              }
          }
          EOF

          cat > "$PKG/system/GameDetector.kt" <<'EOF'
          package ai.venice.pubgcompanion.system

          import android.app.usage.UsageEvents
          import android.app.usage.UsageStatsManager
          import android.content.Context
          import android.os.Build
          import ai.venice.pubgcompanion.core.GamePackages

          class GameDetector(private val ctx: Context) {

              private val resumedEvent: Int =
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) UsageEvents.Event.ACTIVITY_RESUMED
                  else UsageEvents.Event.MOVE_TO_FOREGROUND

              fun foregroundPackage(lookbackMs: Long = 20_000L): String? {
                  val usm = ctx.getSystemService(Context.USAGE_STATS_SERVICE) as? UsageStatsManager ?: return null
                  val end = System.currentTimeMillis()
                  val events = usm.queryEvents(end - lookbackMs, end) ?: return null
                  val e = UsageEvents.Event()
                  var pkg: String? = null
                  var newest = 0L
                  while (events.hasNextEvent()) {
                      events.getNextEvent(e)
                      if (e.eventType == resumedEvent && e.timeStamp >= newest) {
                          newest = e.timeStamp
                          pkg = e.packageName
                      }
                  }
                  return pkg
              }

              fun currentGamePackage(): String? {
                  val fg = foregroundPackage() ?: return null
                  return if (GamePackages.ALL.contains(fg)) fg else null
              }

              fun isGameInForeground(): Boolean = currentGamePackage() != null
          }
          EOF

          cat > "$PKG/system/ShizukuShell.kt" <<'EOF'
          package ai.venice.pubgcompanion.system

          import android.content.pm.PackageManager
          import rikka.shizuku.Shizuku

          object ShizukuShell {

              fun binderAlive(): Boolean = runCatching { Shizuku.pingBinder() }.getOrDefault(false)

              fun hasPermission(): Boolean = binderAlive() && runCatching {
                  Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
              }.getOrDefault(false)

              fun requestPermission(requestCode: Int = 4242) {
                  if (binderAlive() && !hasPermission()) {
                      runCatching { Shizuku.requestPermission(requestCode) }
                  }
              }

              fun exec(command: String): String? = runCatching {
                  val process = Shizuku.newProcess(arrayOf("sh", "-c", command), null, null)
                  val out = process.inputStream.bufferedReader().use { it.readText() }
                  process.waitFor()
                  out.trim()
              }.getOrNull()
          }

          object ResolutionController {

              fun apply(width: Int, height: Int, dpi: Int): Boolean =
                  ShizukuShell.exec("wm size ${width}x$height && wm density $dpi") != null

              fun reset(): Boolean = ShizukuShell.exec("wm size reset && wm density reset") != null
          }

          object BackgroundKiller {

              val PRESETS = listOf(
                  "com.facebook.katana",
                  "com.facebook.orca",
                  "com.instagram.android",
                  "com.zhiliaoapp.musically",
                  "com.google.android.apps.maps",
                  "com.samsung.android.app.spage",
              )

              fun kill(packages: List<String> = PRESETS): Int =
                  packages.count { ShizukuShell.exec("am force-stop $it") != null }
          }

          object SurfaceFlingerProbe {

              private fun layerFor(pkg: String): String? =
                  ShizukuShell.exec("dumpsys SurfaceFlinger --list")
                      ?.lines()
                      ?.firstOrNull { it.contains(pkg, true) && it.contains("SurfaceView", true) }

              fun fps(pkg: String): Int? {
                  val layer = layerFor(pkg) ?: return null
                  val out = ShizukuShell.exec("dumpsys SurfaceFlinger --latency \"$layer\"") ?: return null
                  val stamps = out.lines().drop(1)
                      .mapNotNull { it.trim().split(" ").getOrNull(1)?.toLongOrNull() }
                      .filter { it > 0L }
                  if (stamps.size < 4) return null
                  val span = (stamps.max() - stamps.min()) / 1_000_000_000.0
                  if (span <= 0.0) return null
                  return (stamps.size / span).toInt()
              }
          }
