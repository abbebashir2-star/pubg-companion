name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate the whole project
        run: |
          cat > /tmp/gen.sh <<'BOOTSTRAP'
          #!/usr/bin/env bash
          set -euo pipefail

          PKG="app/src/main/java/ai/venice/pubgcompanion"
          mkdir -p "$PKG"/{core,data,system,service,ui/theme,ui/screens,util}
          mkdir -p app/src/main/res/{values,drawable,mipmap-anydpi-v26}
          mkdir -p gradle/wrapper

          echo "==> skriver projektfiler"

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PubgCompanion"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.0" apply false
              id("com.google.devtools.ksp") version "2.1.0-1.0.29" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > gradlew <<'EOF'
          #!/bin/sh
          exec java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

          cat > .gitignore <<'EOF'
          *.iml
          .gradle/
          .idea/
          .DS_Store
          build/
          captures/
          .externalNativeBuild
          .cxx
          local.properties
          app/build/
          *.apk
          *.keystore
          EOF

          cat > README.md <<'EOF'
          # PUBG Companion

          Android performance companion for PUBG Mobile. Detects match start via usage
          stats, applies a saved profile, restores everything when the match ends.

          Install [Shizuku](https://shizuku.rikka.app/) for the full feature set.
          Grab the APK from the Releases tab.
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "ai.venice.pubgcompanion"
              compileSdk = 35

              defaultConfig {
                  applicationId = "ai.venice.pubgcompanion"
                  minSdk = 26
                  targetSdk = 35
