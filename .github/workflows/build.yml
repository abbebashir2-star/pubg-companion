          cat > "$PKG/core/Permissions.kt" <<'EOF'
          package com.qalbidagx.pubg.core

          import android.app.AppOpsManager
          import android.app.NotificationManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.PowerManager
          import android.os.Process
          import android.provider.Settings

          enum class PermissionKind(val title: String, val why: String) {
              USAGE_ACCESS("Usage access", "Lets the app see that PUBG started."),
              OVERLAY("Draw over other apps", "Needed for the overlay and crosshair."),
              DND("Do Not Disturb access", "Silences notifications during a match."),
              WRITE_SETTINGS("Modify system settings", "Brightness, touch sensitivity, timeout."),
              BATTERY("Ignore battery optimisation", "Otherwise Samsung kills the service."),
              NOTIFICATIONS("Notifications", "Lets the foreground service survive."),
          }

          object Permissions {

              fun isGranted(ctx: Context, kind: PermissionKind): Boolean = when (kind) {
                  PermissionKind.USAGE_ACCESS -> hasUsageAccess(ctx)
                  PermissionKind.OVERLAY -> Settings.canDrawOverlays(ctx)
                  PermissionKind.DND ->
                      (ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager)
                          .isNotificationPolicyAccessGranted
                  PermissionKind.WRITE_SETTINGS -> Settings.System.canWrite(ctx)
                  PermissionKind.BATTERY ->
                      (ctx.getSystemService(Context.POWER_SERVICE) as PowerManager)
                          .isIgnoringBatteryOptimizations(ctx.packageName)
                  PermissionKind.NOTIFICATIONS ->
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU)
                          ctx.checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) ==
                              PackageManager.PERMISSION_GRANTED
                      else true
              }

              fun intent(ctx: Context, kind: PermissionKind): Intent = when (kind) {
                  PermissionKind.USAGE_ACCESS -> Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS)
                  PermissionKind.OVERLAY -> Intent(
                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                      Uri.parse("package:${ctx.packageName}")
                  )
                  PermissionKind.DND -> Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS)
                  PermissionKind.WRITE_SETTINGS -> Intent(
                      Settings.ACTION_MANAGE_WRITE_SETTINGS,
                      Uri.parse("package:${ctx.packageName}")
                  )
                  PermissionKind.BATTERY -> Intent(
                      Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                      Uri.parse("package:${ctx.packageName}")
                  )
                  PermissionKind.NOTIFICATIONS -> Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS)
                      .putExtra(Settings.EXTRA_APP_PACKAGE, ctx.packageName)
              }

              fun missing(ctx: Context): List<PermissionKind> =
                  PermissionKind.entries.filterNot { isGranted(ctx, it) }

              private fun hasUsageAccess(ctx: Context): Boolean {
                  val appOps = ctx.getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager
                  val mode = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      appOps.unsafeCheckOpNoThrow(
                          AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), ctx.packageName
                      )
                  } else {
                      @Suppress("DEPRECATION")
                      appOps.checkOpNoThrow(
                          AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), ctx.packageName
                      )
                  }
                  return mode == AppOpsManager.MODE_ALLOWED
              }
          }
          EOF

          cat > "$PKG/data/Profile.kt" <<'EOF'
          package com.qalbidagx.pubg.data

          import android.content.Context
          import androidx.room.*
          import kotlinx.coroutines.flow.Flow

          @Entity(tableName = "profiles")
          data class Profile(
              @PrimaryKey(autoGenerate = true) val id: Long = 0L,
              val name: String,
              val enabled: Boolean = true,
              val perfMode: String = "balanced",
              val dnd: Boolean = true,
              val brightnessPercent: Int = 85,
              val refreshRateHz: Int = 120,
              val lowerResolution: Boolean = false,
              val resolutionWidth: Int = 1280,
              val resolutionHeight: Int = 720,
              val resolutionDpi: Int = 320,
              val pinToBigCores: Boolean = true,
              val boostPriority: Boolean = true,
              val restrictBackground: Boolean = true,
              val chargeSeparation: Boolean = true,
              val killBackground: Boolean = false,
              val thermalGuard: Boolean = true,
              val temperatureLimitC: Int = 43,
          )

          @Dao
          interface ProfileDao {
              @Query("SELECT * FROM profiles ORDER BY id")
              fun observeAll(): Flow<List<Profile>>

              @Query("SELECT * FROM profiles WHERE enabled = 1")
              suspend fun enabledProfiles(): List<Profile>

              @Insert suspend fun insert(p: Profile): Long
              @Update suspend fun update(p: Profile)
              @Delete suspend fun delete(p: Profile)
          }

          @Database(entities = [Profile::class], version = 3, exportSchema = false)
          abstract class AppDatabase : RoomDatabase() {
              abstract fun profiles(): ProfileDao

              companion object {
                  @Volatile private var instance: AppDatabase? = null

                  fun get(ctx: Context): AppDatabase = instance ?: synchronized(this) {
                      instance ?: Room.databaseBuilder(
                          ctx.applicationContext, AppDatabase::class.java, "qalbidagx.db"
                      ).fallbackToDestructiveMigration().build().also { instance = it }
                  }
              }
          }

          class ProfileRepository(private val dao: ProfileDao) {

              val all: Flow<List<Profile>> = dao.observeAll()

              suspend fun enabled(): List<Profile> = dao.enabledProfiles()

              suspend fun save(p: Profile) {
                  if (p.id == 0L) dao.insert(p) else dao.update(p)
              }

              suspend fun delete(p: Profile) = dao.delete(p)

              suspend fun ensureDefault() {
                  if (dao.enabledProfiles().isNotEmpty()) return
                  dao.insert(Profile(name = "Daily", perfMode = "balanced", refreshRateHz = 120))
                  dao.insert(
                      Profile(
                          name = "Ranked",
                          perfMode = "rise",
                          refreshRateHz = 120,
                          lowerResolution = true,
                          killBackground = true,
                      )
                  )
              }
          }
          EOF

          cat > "$PKG/data/CrosshairStyle.kt" <<'EOF'
