                              label = { Text("Your dpi") },
                              singleLine = true,
                              modifier = Modifier.weight(1f),
                          )
                          OutlinedTextField(
                              value = vm.toDpi.toString(),
                              onValueChange = { vm.setToDpi(it.toIntOrNull() ?: 400) },
                              label = { Text("Target dpi") },
