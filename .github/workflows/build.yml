                                                  nav.navigate(d.route) {
                                                      popUpTo(nav.graph.startDestinationId) { saveState = true }
                                                      launchSingleTop = true
                                                      restoreState = true
                                                  }
                                              },
                                              icon = { Icon(d.icon, contentDescription = d.label) },
                                              label = { Text(d.label, fontSize = 9.sp) },
